<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源展示中心</title>
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../Styles/ShowAll.css">

</head>

<body>

  <!-- 头部 -->
  <header>
    <h1 style="color: rgb(89, 130, 246)">🐟️ 资源展示中心</h1>
    <div class="tabs">
      <button class="tab active" data-tab="all">全部</button>
      <button class="tab" data-tab="game"><i class="fas fa-gamepad"></i> Game</button>
      <button class="tab" data-tab="media"><i class="fas fa-file-alt"></i> Media</button>
      <button class="tab" data-tab="other"><i class="fas fa-folder"></i> Other</button>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="container">
    <div class="resource-grid" id="resource-grid">
      <!-- 资源卡片由 JavaScript 动态渲染 -->
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-title">我的网站</span>
      <p class="footer-copyright">© 2026 保留所有权利</p>
      <p class="footer-credit">Made with ❤️ &amp; Me</p>
    </div>
  </footer>

  <script src="../Scripts/ShowAll.js"></script>

</body>

</html>
