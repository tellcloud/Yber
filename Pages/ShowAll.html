<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源展示中心</title>
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../Styles/ShowAll.css">

</head>

<body>

  <!-- 头部 -->
  <header>
    <h1 style="color: rgb(89, 130, 246)">🐟️ 资源展示中心</h1>
    <div class="tabs">
      <button class="tab active" data-tab="all">全部</button>
      <button class="tab" data-tab="game"><i class="fas fa-gamepad"></i> Game</button>
      <button class="tab" data-tab="blog"><i class="fas fa-file-alt"></i> Blog</button>
      <button class="tab" data-tab="other"><i class="fas fa-folder"></i> Other</button>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="container">
    <div class="resource-grid" id="resource-grid">
      <!-- 资源卡片由 JavaScript 动态渲染 -->
    </div>
  </div>

  <footer class="bg-zinc-900 text-white py-16">
        <div class="max-w-7xl mx-auto px-6">
            <div class="grid md:grid-cols-12 gap-y-10">
                <div class="md:col-span-5">
                    <div class="flex items-center gap-3 mb-6">
                        <span class="text-2xl font-bold">我的网站</span>
                    </div>
                    <p class="text-xs text-zinc-500 mt-8">© 2026 保留所有权利</p>
                </div>
                    <p class="mt-12 text-xs text-zinc-500">Made with ❤️ &amp; Tailwind CSS</p>
            </div>
        </div>
    </footer>

  <script src="../Scripts/ShowAll.js"></script>

</body>

</html>
