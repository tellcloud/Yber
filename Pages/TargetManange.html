<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>目标管理台</title>
<style>
:root{
  --bg:#f4f5fa; --card:#ffffff; --ink:#1f2430; --ink2:#5c6472; --muted:#8b93a7; --line:#e7e9f2;
  --purple:#7c5cff; --purple-d:#6a46ff; --grad:linear-gradient(135deg,#7c5cff 0%,#9d7bff 100%);
  --green:#159a52; --green-bg:#e9f8ef; --red:#d92d20; --red-bg:#fdecea; --amber:#b45309; --amber-bg:#fdf3e0; --gray-bg:#f0f1f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}
h3{font-size:15px}
.muted{color:var(--muted);font-size:12.5px}
.ic{flex:none}

/* ---------- layout ---------- */
#sidebar{display:none}
#topbar{display:flex;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:12px}
.topnav{display:none;gap:4px}
#bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.main{padding-bottom:84px}
#content{padding:16px 14px 28px}
@media(min-width:640px){
  #bottomnav{display:none!important}
  .topnav{display:flex}
  .main{padding-bottom:0}
  #content{padding:22px 20px 48px}
  .wk-metrics{grid-template-columns:repeat(3,1fr)}
  .wk-notes{grid-template-columns:1fr 1fr}
}
@media(min-width:1024px){
  #topbar{display:none}
  #sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:236px;flex-direction:column;background:#fff;border-right:1px solid var(--line);padding:22px 14px;z-index:30}
  .main{margin-left:236px}
  #content{max-width:1080px;margin:0 auto;padding:28px 28px 64px}
  .board-grid{grid-template-columns:1fr 1fr}
}

/* ---------- brand & nav ---------- */
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(124,92,255,.35);flex:none}
.brand b{font-size:16px;display:block;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:1px}
#sidebar .brand{padding:2px 8px 20px}
#sidebar nav{display:flex;flex-direction:column;gap:4px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.7;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;color:var(--ink2);font-weight:600;cursor:pointer;border:none;background:transparent;width:100%;font-size:14.5px;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:#f5f3ff;color:var(--purple-d)}
.nav-item.active{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.3)}
#bottomnav .nav-item{flex:1;flex-direction:column;gap:3px;font-size:12px;padding:7px 4px;border-radius:10px}
#bottomnav .nav-item.active{background:#f1edff;color:var(--purple-d);box-shadow:none}
.topnav .nav-item{padding:8px 14px}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(31,36,48,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-weight:600;color:#fff;background:var(--grad);padding:10px 16px;border-radius:12px;box-shadow:0 4px 14px rgba(124,92,255,.28);transition:transform .08s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:#fff;color:var(--purple-d);border:1.5px solid #d9d2ff;box-shadow:none}
.btn.ghost:hover{background:#f6f3ff}
.btn.warn{background:#fff;color:var(--red);border:1.5px solid #f3c2bf;box-shadow:none}
.btn.warn:hover{background:#fff6f5}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(220,38,38,.25)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:none;background:transparent;color:var(--ink2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--gray-bg);color:var(--ink)}
.icon-btn.danger:hover{background:var(--red-bg);color:var(--red)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--gray-bg);color:var(--ink2);white-space:nowrap}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.purple{background:#f1edff;color:var(--purple-d)}
.chip.gray{background:var(--gray-bg);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:4px;background:var(--gc,var(--purple));flex:none}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);margin:20px 2px 10px;letter-spacing:.02em}
.sec-title .ic{color:var(--purple)}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}
.stack{display:grid;gap:14px;max-width:720px}
.progress{height:8px;background:#eef0f6;border-radius:99px;overflow:hidden;margin:10px 0}
.progress>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.new-goal-btn{width:100%;padding:14px;font-size:15px;border-radius:14px}
.bottom-new{margin-top:18px}
.today-meta{font-size:12.5px;color:var(--muted);margin:9px 2px 0}

/* ---------- goal cards ---------- */
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.goal{position:relative;overflow:hidden;margin-bottom:14px;padding-left:20px;animation:rise .25s ease}
.goal::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,var(--purple))}
.goal.rest{background:linear-gradient(180deg,#fffdf4,#fff);border-color:#f0dfa8}
.goal.broken,.goal.overdue{background:linear-gradient(180deg,#fffafa,#fff);border-color:#f3cdc9}
.goal.done{background:linear-gradient(180deg,#f7fdf9,#fff);border-color:#c9ecd6}
.goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.goal-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:15.5px}
.goal-title .chips{display:flex;gap:6px;flex-wrap:wrap}
.goal-actions{display:flex;gap:2px;flex:none}
.goal-stats{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink2);margin-top:8px}
.goal-stats b{color:var(--ink);font-size:14px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6;margin:10px 0}
.notice.amber{background:var(--amber-bg);color:#8a5a00}
.notice.red{background:var(--red-bg);color:#a21b12}
.notice.green{background:var(--green-bg);color:#0f6b3c}
.notice svg{margin-top:2px}
.plan{background:#fafaff;border:1px dashed #dcd7f5;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px}
.plan-row{display:flex;gap:8px;padding:3px 0;line-height:1.55}
.plan-k{flex:none;font-weight:700;color:var(--purple-d);width:38px}
.suggest{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:10px 0 12px}
.suggest b{font-size:18px;color:var(--ink)}
.goal-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- board ---------- */
.board-grid{display:grid;gap:14px}
.panel{animation:rise .25s ease}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h3{font-size:15.5px}
.panel-head .chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ring-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring-num{fill:var(--ink);font-size:21px;font-weight:700}
.ring-sub{fill:var(--muted);font-size:10.5px}
.nums{flex:1;min-width:190px;display:grid;gap:10px}
.num{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.num-k{font-size:12px;color:var(--muted);width:58px;flex:none}
.num b{font-size:15px}
.rec-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 4px}
.rec-acts{display:flex;gap:2px}
.rec-list ul{list-style:none}
.rec{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.rec:last-child{border-bottom:none}
.rec-date{color:var(--ink2);width:126px;flex:none}
.rec-amt{font-weight:700;color:var(--purple-d)}
.rec-min{color:var(--muted)}
.rec-note{color:var(--muted);flex:1;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .icon-btn{width:28px;height:28px;margin-left:auto}
.bf{font-style:normal;font-size:10.5px;background:var(--amber-bg);color:var(--amber);border-radius:5px;padding:1px 5px;margin-left:5px;font-weight:700}
.chart-card{margin-bottom:8px}
.chart{width:100%;height:auto;display:block}
.chart .axis{fill:#9aa1b5;font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- week ---------- */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.wk-range{text-align:center;flex:1}
.wk-range b{display:block;font-size:15px}
.wk-range span{font-size:12px}
.wk-summary{display:grid;gap:12px;margin-bottom:14px}
@media(min-width:640px){.wk-summary{grid-template-columns:repeat(3,1fr)}}
.sum-item{background:#fafaff;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.sum-item .k{font-size:12px;color:var(--muted)}
.sum-item b{font-size:16px}
.wk-goal{margin-bottom:12px;animation:rise .25s ease}
.wk-goal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-goal-head b{font-size:15px}
.wk-metrics{display:grid;gap:8px;margin-top:10px}
.wk-m{background:#fafaff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.wk-m .k{font-size:12px;color:var(--muted)}
.wk-m .cur{font-size:16px;font-weight:700}
.wk-m .prev{font-size:12px;color:var(--muted)}
.wk-notes{display:grid;gap:12px}
.wk-note textarea{min-height:84px;resize:vertical}
.wk-gen{margin-top:14px;display:flex;justify-content:center}

/* ---------- me ---------- */
.me-card h3{margin-bottom:6px}
.me-card p{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:12px}
.me-card .btn{margin-bottom:4px}
.danger-zone{border-color:#f3cdc9;background:linear-gradient(180deg,#fffafa,#fff)}
.clear-row{display:flex;gap:10px;flex-wrap:wrap}
.clear-row input{flex:1;min-width:180px;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.clear-row input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(217,45,32,.12)}
.steps{margin:4px 0 0;padding-left:20px;line-height:2.05;font-size:13.5px;color:var(--ink2)}

/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.overlay{position:absolute;inset:0;background:rgba(20,22,34,.45)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100vw - 28px));max-height:calc(100vh - 44px);display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(20,22,34,.28);overflow:hidden;animation:rise .2s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px}
.modal-body{padding:18px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:#fafafe;flex-wrap:wrap}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,92,255,.14)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--ink2);background:var(--gray-bg);border-radius:10px;padding:9px 11px;line-height:1.6}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.sel{border-color:#1f2430;box-shadow:0 0 0 2px #fff inset}
.modal-body p{font-size:13.5px;line-height:1.7;margin-bottom:8px}
.modal-body p.muted{margin-bottom:0}

/* ---------- banner / toast / confetti ---------- */
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f3efff,#edf9f1);border:1px solid #e3dcff;border-radius:14px;padding:12px 14px;margin-top:4px}
.banner .ic{color:var(--purple-d)}
.banner-txt{flex:1;min-width:0}
.banner-txt b{display:block;font-size:13.5px}
.banner-txt span{font-size:12px;color:var(--ink2)}
.banner-x{margin-left:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:#1f2430;color:#fff;font-size:13.5px;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:86vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:640px){#toast{bottom:36px}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <div class="brand-logo" id="brand-logo"></div>
    <div><b>目标管理台</b><small>有终点的目标，才需要管理</small></div>
  </div>
  <nav id="side-nav"></nav>
  <div class="side-foot">所有数据仅保存在本机浏览器<br>不上传、不联网，断网也能用</div>
</aside>

<div class="main">
  <header id="topbar">
    <div class="brand">
      <div class="brand-logo" id="brand-logo-sm"></div>
      <b>目标管理台</b>
    </div>
    <nav class="topnav" id="top-nav"></nav>
  </header>
  <div id="banner"></div>
  <main id="content"></main>
</div>

<nav id="bottomnav"></nav>
<div id="modal-root"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<noscript>需要启用 JavaScript 才能使用本工具。</noscript>

<script>
(function(){
'use strict';

/* ================= 基础工具 ================= */
var LS_KEY='goalTracker.v1';
var LEGACY_KEY='goalTracker.v0';
var PRESET_COLORS=['#7c5cff','#0ea5e9','#f59e0b','#10b981','#ef4444','#ec4899','#6366f1','#14b8a6'];

var ICONS={
  plus:'<path d="M12 5v14M5 12h14"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  chart:'<path d="M18 20V10M12 20V4M6 20v-6"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/>',
  edit:'<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flame:'<path d="M12 22c3.9 0 7-2.7 7-6.4 0-4.5-4.4-6.1-4.4-10.6 0 0-3.1 2.1-3.1 6.3 0 1.6-1.1-.6-1.1-2.7C8.6 10.2 5 12.4 5 15.6 5 19.3 8.1 22 12 22z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkcircle:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  right:'<path d="M9 18l6-6-6-6"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/>'
};
function ic(n,s,cls){
  s=s||18;
  return '<svg class="ic '+(cls||'')+'" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(s){return document.querySelector(s);}

/* ---------- 日期工具（本地时区） ---------- */
function pad2(n){return String(n).padStart(2,'0');}
function fmtD(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return fmtD(new Date());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d);}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function mondayOf(s){var d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtD(d);}
function dateCN(s){var d=parseD(s);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function dowCN(s){return '周'+'日一二三四五六'[parseD(s).getDay()];}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtNum(n){var v=Math.round(n*10)/10;return Number.isInteger(v)?String(v):v.toFixed(1);}
function pct(r){return Math.round(r*100)+'%';}

/* ================= 状态 ================= */
var state=null;

function normalize(d){
  if(Array.isArray(d))d={goals:d,records:[]};
  d=d||{};
  var T=todayStr();

/* ================= 核心计算 ================= */
function restDaysOf(g,recDays){
  var rest={},used={},T=todayStr();
  var from=addDays(g.createdAt,1); /* 创建当天不算漏打 */
  if(from<T){
    for(var d=from;d<T;d=addDays(d,1)){
      if(!recDays[d]){
        var wk=mondayOf(d);
        if(!used[wk]){used[wk]=1;rest[d]=1;}
      }
    }
  }
  return {rest:rest,used:used};
}
function calc(g){
  var T=todayStr();
  var recs=state.records.filter(function(r){return r.goalId===g.id;});
  var sum=recs.reduce(function(a,r){return a+r.amount;},0);
  var rate=g.total>0?Math.min(sum/g.total,1):0;
  var recDays={};recs.forEach(function(r){recDays[r.date]=1;});
  var rd=restDaysOf(g,recDays);
  var rest=rd.rest,used=rd.used;

  /* 连续打卡：今天未打则从昨天算起；漏打日若为当周首个漏打（休息日）则不断 */
  var end=recDays[T]?T:addDays(T,-1);
  var streak=0,guard=0;
  for(var d=end;d>=g.createdAt&&guard<900;d=addDays(d,-1),guard++){
    if(recDays[d]||rest[d])streak++;
    else break;
  }
  var y=addDays(T,-1);
  var missedY=!recDays[y];
  var yIsRest=!!rest[y];

  /* 近 7 天平均速度与预计完成日 */
  var w0=addDays(T,-6);
  var recent=recs.filter(function(r){return r.date>=w0&&r.date<=T;});
  var speed=recent.reduce(function(a,r){return a+r.amount;},0)/7;
  var remaining=Math.max(0,g.total-sum);
  var ddl=diffDays(T,g.deadline);            /* >0 未来，<0 已逾期 */
  var remDays=Math.max(1,ddl+1);
  var suggested=remaining>0?remaining/remDays:0;
  var estD=null,late=null;
  if(remaining>0&&speed>0){
    estD=addDays(T,Math.max(1,Math.ceil(remaining/speed)));
    late=diffDays(g.deadline,estD);          /* >0 拖后，<0 提前 */
  }
  var done=g.total>0&&remaining<=0;
  var overdue=!done&&ddl<0;
  return {recs:recs,sum:sum,rate:rate,recDays:recDays,streak:streak,missedY:missedY,yIsRest:yIsRest,
    rest:rest,used:used,speed:speed,remaining:remaining,ddl:ddl,remDays:remDays,suggested:suggested,
    estD:estD,late:late,done:done,overdue:overdue};
}

function chartSVG(){
  var goals=chartGoals();
  if(!goals.length)return '<div class="empty">近 14 天暂无分钟记录<br>打卡时填写分钟数后，这里会出现分目标堆叠柱状图</div>';
  var T=todayStr(),days=[];
  for(var i=13;i>=0;i--)days.push(addDays(T,-i));
  var rows=days.map(function(d){
    var vals=goals.map(function(g){
      return state.records.filter(function(r){return r.goalId===g.id&&r.date===d;}).reduce(function(a,r){return a+(r.minutes||0);},0);
    });
    return {d:d,vals:vals,total:vals.reduce(function(a,b){return a+b;},0)};
  });
  var max=0;rows.forEach(function(r){if(r.total>max)max=r.total;});
  var niceMax=Math.max(15,Math.ceil(max/15)*15);
  var W=720,H=236,padL=34,padB=26,padT=10,iw=W-padL-8,ih=H-padB-padT;
  var bw=Math.min(32,iw/14*0.58);
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="近14天投入分钟堆叠柱状图">';
  for(var gi=0;gi<=4;gi++){
    var y=padT+ih-ih*gi/4,v=Math.round(niceMax*gi/4);
    s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#eef0f6"/>'+
       '<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" class="axis">'+v+'</text>';
  }
  rows.forEach(function(r,i){
    var x=padL+iw*(i+0.5)/14-bw/2,yBase=padT+ih,y=yBase;
    r.vals.forEach(function(val,gi){
      if(val<=0)return;
      var h=ih*val/niceMax;y-=h;
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+goals[gi].color+'"><title>'+dateCN(r.d)+' '+esc(goals[gi].name)+'：'+val+' 分钟</title></rect>';
    });
    if(r.total>0){
      s+='<rect x="'+x.toFixed(1)+'" y="'+(yBase-r.total*ih/niceMax).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(r.total*ih/niceMax).toFixed(1)+'" fill="transparent"><title>'+dateCN(r.d)+' 合计 '+r.total+' 分钟</title></rect>';
    }
    if(i%2===0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="axis">'+(parseD(r.d).getMonth()+1)+'/'+parseD(r.d).getDate()+'</text>';
  });
  s+='</svg>';
  return s;
}

/* ---------- 周报 ---------- */
function weekAgg(monday){
  var end=addDays(monday,6),ps=addDays(monday,-7),pe=addDays(monday,-1);
  return state.goals.map(function(g){
    var recs=state.records.filter(function(r){return r.goalId===g.id&&r.date>=monday&&r.date<=end;});
    var prev=state.records.filter(function(r){return r.goalId===g.id&&r.date>=ps&&r.date<=pe;});
    var days={},pdays={};
    recs.forEach(function(r){days[r.date]=1;});prev.forEach(function(r){pdays[r.date]=1;});
    return {
      g:g,
      amt:recs.reduce(function(a,r){return a+r.amount;},0),
      pamt:prev.reduce(function(a,r){return a+r.amount;},0),
      days:Object.keys(days).length,pdays:Object.keys(pdays).length,
      mins:recs.reduce(function(a,r){return a+(r.minutes||0);},0),
      pmins:prev.reduce(function(a,r){return a+(r.minutes||0);},0)
    };
  });
}
function deltaChip(cur,prev){
  if(!prev&&!cur)return '<span class="chip gray">—</span>';
  if(!prev)return '<span class="chip green">新增</span>';
  var p=Math.round((cur-prev)/prev*100);
  if(p===0)return '<span class="chip gray">持平</span>';
  return p>0?'<span class="chip green">▲ '+p+'%</span>':'<span class="chip red">▼ '+Math.abs(p)+'%</span>';
}
function pctDelta(cur,prev){
  if(!prev)return cur>0?'新增':'无变化';
  var p=Math.round((cur-prev)/prev*100);
  return (p>0?'+':'')+p+'%';
}
function reportText(monday){
  var rows=weekAgg(monday);
  var L=[];
  L.push('【目标周报】'+dateCN(monday)+' - '+dateCN(addDays(monday,6))+'（周一到周日）');
  L.push('');
  L.push('一、投入量（附上周环比）');
  rows.forEach(function(r){L.push('· '+r.g.name+'：'+fmtNum(r.amt)+' '+r.g.unit+'（上周 '+fmtNum(r.pamt)+'，'+pctDelta(r.amt,r.pamt)+'）');});
  L.push('');
  L.push('二、打卡天数（附上周环比）');
  rows.forEach(function(r){L.push('· '+r.g.name+'：'+r.days+' 天（上周 '+r.pdays+' 天，'+pctDelta(r.days,r.pdays)+'）');});
  var tm=rows.reduce(function(a,r){return a+r.mins;},0),tpm=rows.reduce(function(a,r){return a+r.pmins;},0);
  L.push('');
  L.push('三、投入分钟（附上周环比）');
  L.push('· 合计：'+tm+' 分钟（上周 '+tpm+' 分钟，'+pctDelta(tm,tpm)+'）');
  rows.forEach(function(r){if(r.mins||r.pmins)L.push('· '+r.g.name+'：'+r.mins+' 分钟（上周 '+r.pmins+' 分钟）');});
  L.push('');
  L.push('四、本周复盘');
  var n=state.weeklyNotes[monday]||{};
  L.push('【保持】'+(n.keep||'（未填写）'));
  L.push('【问题】'+(n.problem||'（未填写）'));
  L.push('【尝试】'+(n.try||'（未填写）'));
  L.push('【下周预案】'+(n.next||'（未填写）'));
  return L.join('\n');
}

/* ---------- 打卡 / 补记 ---------- */
function openCheckin(gid,date){
  var g=null;state.goals.forEach(function(x){if(x.id===gid)g=x;});
  if(!g)return;
  var c=calc(g),T=todayStr();
  var opts=[];
  for(var i=6;i>=0;i--){
    var d=addDays(T,-i),sel=(d===(date||T))?' selected':'';
    opts.push('<option value="'+d+'"'+sel+'>'+(i===0?'今天':(i===1?'昨天':i+' 天前'))+(i>0?'（补）':'')+' · '+dateCN(d)+' '+dowCN(d)+'</option>');
  }
  openModal('打卡 · '+esc(g.name),
    '<label class="fld"><span>日期</span><select id="ck-date">'+opts.join('')+'</select></label>'+
    '<label class="fld"><span>数量（'+esc(g.unit)+'）</span><input id="ck-amount" type="number" min="0.01" step="any" value="'+fmtNum(c.suggested)+'"></label>'+
    '<label class="fld"><span>投入分钟（选填）</span><input id="ck-min" type="number" min="0" step="1" placeholder="例如 25"></label>'+
    '<label class="fld"><span>备注（选填）</span><input id="ck-note" type="text" maxlength="60" placeholder="例如：通勤时完成"></label>'+
    '<div class="hint">今日建议量 = 剩余 '+fmtNum(c.remaining)+' '+esc(g.unit)+' ÷ 剩余 '+c.remDays+' 天，已预填，可以直接修改。选择过去的日期即为补记，会带上“补”标并按真实日期参与连续天数与速度推算。</div>',
    '<button class="btn ghost" data-action="close-modal">取消</button><button class="btn" id="ck-save">保存打卡</button>');
  $('#ck-save').onclick=function(){
    var amt=parseFloat($('#ck-amount').value);
    if(!(amt>0)){toast('请输入大于 0 的数量');return;}
    var d=$('#ck-date').value,mn=$('#ck-min').value;
    var wasDone=c.done;
    state.records.push({id:uid('r'),goalId:g.id,date:d,amount:amt,
      minutes:(mn===''||mn==null)?null:+mn,backfill:d<T,note:$('#ck-note').value.trim(),ts:Date.now()});
    save();
    var nowDone=calc(g).done;
    closeModal();render();
    if(!wasDone&&nowDone){confetti();toast('目标达成，恭喜！');}
    else toast(d<T?('已补记 '+dateCN(d)):'打卡成功');
  };
}

function importFile(f){
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{data=JSON.parse(rd.result);}catch(e){toast('文件解析失败，请选择正确的 JSON 备份');return;}
    var norm=normalize(data);
    openModal('确认覆盖导入',
      '<p>将用文件中的 <b>'+norm.goals.length+'</b> 个目标、<b>'+norm.records.length+'</b> 条记录<b>覆盖</b>当前全部数据，此操作不可撤销。</p>'+
      '<p class="muted">建议先导出当前数据作为备份。</p>',
      '<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" id="import-ok">确认覆盖导入</button>');
    $('#import-ok').onclick=function(){
      state=norm;state.legacyMigrated=true;save();closeModal();render();toast('导入完成');
    };

function doMigrate(){
  var raw=null;
  try{raw=localStorage.getItem(LEGACY_KEY);}catch(e){}
  if(!raw){toast('未发现旧版本数据');return;}
  var data;
  try{data=JSON.parse(raw);}catch(e){toast('旧数据解析失败');return;}
  var norm=normalize(data);
  openModal('旧版本迁移',
    '<p>发现旧版本数据：<b>'+norm.goals.length+'</b> 个目标、<b>'+norm.records.length+'</b> 条记录。</p>'+
    '<p class="muted">将合并到当前数据：同 ID 目标以旧版覆盖，记录按 ID 去重追加。原数据仍保留在浏览器中。</p>',
    '<button class="btn ghost" data-action="close-modal">取消</button><button class="btn" id="mig-ok">开始迁移</button>');
  $('#mig-ok').onclick=function(){
    norm.goals.forEach(function(ng){
      var i=-1;state.goals.forEach(function(g,idx){if(g.id===ng.id)i=idx;});
      if(i>=0)state.goals[i]=ng;else state.goals.push(ng);
    });
    var have={};state.records.forEach(function(r){have[r.id]=1;});
    norm.records.forEach(function(r){if(!have[r.id])state.records.push(r);});
    state.legacyMigrated=true;
    save();closeModal();render();toast('旧版本数据已迁移');
  };
}

  $('#cs-ok').onclick=function(){
    state.goals=state.goals.filter(function(g){return !g.sample;});
    state.records=state.records.filter(function(r){return !ids[r.goalId];});
    save();closeModal();render();toast('示例数据已清空');
  };
}
function tryClearAll(){
  openModal('清空全部数据',
    '<p>将删除 <b>'+state.goals.length+'</b> 个目标和 <b>'+state.records.length+'</b> 条记录，<b>不可恢复</b>。</p>'+
    '<p class="muted">如需保留，请先在「我的」导出 JSON 备份。</p>',
    '<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" id="ca-ok">确认清空</button>');
  $('#ca-ok').onclick=function(){
    var mig=state.legacyMigrated;
    state={goals:[],records:[],weeklyNotes:{},backupDismissedAt:0,legacyMigrated:mig};
    save();closeModal();render();toast('已清空全部数据');
  };
}
function openReport(){
  var wk=addDays(mondayOf(todayStr()),weekOffset*7);
  var text=reportText(wk);
  openModal('周报文本',
    '<textarea id="report-text" rows="14" style="width:100%;font:inherit;font-size:13px;padding:12px;border:1.5px solid var(--line);border-radius:10px;resize:vertical;line-height:1.6" readonly>'+esc(text)+'</textarea>',
    '<button class="btn ghost" id="dl-report">下载 .txt</button><button class="btn" id="copy-report">复制文本</button>');
  $('#copy-report').onclick=function(){
    var ta=$('#report-text');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('已复制到剪贴板');},function(){fallbackCopy(ta);});
    }else fallbackCopy(ta);
  };
  $('#dl-report').onclick=function(){
    var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='周报-'+wk+'.txt';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
  };
}
function fallbackCopy(ta){
  ta.select();ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');toast('已复制到剪贴板');}
  catch(e){toast('复制失败，请手动全选复制');}
}

/* ================= 反馈 ================= */
var toastTimer=null;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2200);
}
function confetti(){
  var cv=$('#confetti');
  if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.display='block';
  var colors=['#7c5cff','#a78bff','#16a34a','#f59e0b','#0ea5e9','#ec4899','#10b981'];
  var ps=[];
  for(var i=0;i<150;i++){
    ps.push({x:window.innerWidth/2+(Math.random()-0.5)*280,y:window.innerHeight*0.16+Math.random()*50,
      vx:(Math.random()-0.5)*10,vy:Math.random()*-12-3,g:0.32+Math.random()*0.16,
      s:5+Math.random()*6,c:colors[i%colors.length],r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.32,life:1});
  }
  var t0=performance.now();
  function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    var alive=false;
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      if(p.life<=0)continue;
      alive=true;
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      if(t-t0>1700)p.life-=0.018;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
      ctx.restore();
    }
    if(alive&&t-t0<4500)requestAnimationFrame(frame);
    else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none';}
  }
  requestAnimationFrame(frame);
}

/* ================= 事件 ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.dataset.action,id=el.dataset.id;
  if(a==='tab'){tab=el.dataset.tab;weekOffset=0;render();return;}
  switch(a){
    case 'new-goal':openGoalEditor(null);break;
    case 'checkin':openCheckin(id);break;
    case 'backfill':openCheckin(id,addDays(todayStr(),-1));break;
    case 'edit':{var g=null;state.goals.forEach(function(x){if(x.id===id)g=x;});openGoalEditor(g);}break;
    case 'del':confirmDelete(id);break;
    case 'del-record':deleteRecord(id);break;
    case 'export':exportJSON();break;
    case 'import':{var fi=$('#import-file');if(fi)fi.click();else openImportFallback();}break;
    case 'migrate':doMigrate();break;
    case 'clear-sample':confirmClearSample();break;
    case 'clear-all':tryClearAll();break;
    case 'week-prev':weekOffset--;render();break;
    case 'week-next':if(weekOffset<0){weekOffset++;render();}break;
    case 'gen-report':openReport();break;
    case 'dismiss-backup':state.backupDismissedAt=state.records.length;save();renderBanner();break;
    case 'close-modal':closeModal();break;
  }
});
function openImportFallback(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){if(inp.files&&inp.files[0])importFile(inp.files[0]);};
  inp.click();
}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el&&el.dataset&&el.dataset.note){
    var wk=el.dataset.note,k=el.dataset.k;
    if(!state.weeklyNotes[wk])state.weeklyNotes[wk]={};
    state.weeklyNotes[wk][k]=el.value;
    save();
  }
  if(el&&el.id==='clear-all-input'){
    var b=$('#clear-all-btn');
    if(b)b.disabled=el.value.trim()!=='清空';
  }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='import-file'&&e.target.files&&e.target.files[0]){
    importFile(e.target.files[0]);
    e.target.value='';
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
});
var resizeTimer=null;
window.addEventListener('resize',function(){
  clearTimeout(resizeTimer);resizeTimer=setTimeout(render,180);
});

/* ================= 启动 ================= */
if(!load()){state=seed();save();}
render();
try{
  window.__GT={getState:function(){return state;},calc:calc,todayStr:todayStr,addDays:addDays,
    normalize:normalize,seed:seed,weekAgg:weekAgg,reportText:reportText,mondayOf:mondayOf};
}catch(e){}
})();
</script>
